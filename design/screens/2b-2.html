<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)">
            <div style="font-size:14px;color:var(--body);font-weight:700">やめる</div>
            <div style="flex:1;text-align:center;font-size:14px;font-weight:800;color:var(--ink)">記録を修正</div>
            <div style="font-size:14px;color:var(--deep);font-weight:800">保存</div>
          </div>

          <div style="display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid #f0e2bf;background:var(--warnSoft)">
            <div style="width:20px;height:20px;border:1.5px solid var(--warnInk);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--warnInk);flex:none">!</div>
            <div style="flex:1;font-size:12px;color:#7a5b12;line-height:1.5">その日には手入力の記録が既にあります。</div>
          </div>

          <div style="padding:16px 18px;display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;flex-direction:column;gap:6px">
              <div style="font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em">日付</div>
              <div style="display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--warnInk);border-radius:12px;padding:11px 12px;min-height:46px;background:#fff">
                <span style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink)">2026-09-09 水</span>
                <span style="font-size:12px;color:var(--sub)">変更</span>
              </div>
              <div style="font-size:11px;color:var(--faint);line-height:1.6">別の日へ移せます。手で選んだ記録は1日に1つまでです。</div>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <div style="font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em">実施時刻</div>
              <div style="display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;background:#fff">
                <span style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink)">12:05</span>
                <span style="font-size:12px;color:var(--sub)">変更</span>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:2px">
              <div style="font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;padding-bottom:6px">種目</div>
              <div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)">
                <div style="flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink)">スクワット</div>
                <div style="display:flex;align-items:center;gap:6px;flex:none">
                  <div style="border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:36px;display:flex;align-items:center;gap:3px;background:#fff"><span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)">3</span><span style="font-size:11px;color:var(--sub)">セット</span></div>
                  <div style="font-size:12px;color:var(--faint)">×</div>
                  <div style="border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:36px;display:flex;align-items:center;gap:3px;background:#fff"><span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)">10</span><span style="font-size:11px;color:var(--sub)">回</span></div>
                </div>
                <div style="width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fff"><div style="width:11px;height:13px;border:1.5px solid var(--sub);border-top:0;border-radius:0 0 3px 3px;position:relative"><div style="position:absolute;left:-2.5px;right:-2.5px;top:-4px;height:1.5px;background:var(--sub)"></div></div></div>
              </div>
              <div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)">
                <div style="flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink)">腹筋</div>
                <div style="display:flex;align-items:center;gap:6px;flex:none">
                  <div style="border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:36px;display:flex;align-items:center;gap:3px;background:#fff"><span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)">2</span><span style="font-size:11px;color:var(--sub)">セット</span></div>
                  <div style="font-size:12px;color:var(--faint)">×</div>
                  <div style="border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-height:36px;display:flex;align-items:center;gap:3px;background:#fff"><span style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)">20</span><span style="font-size:11px;color:var(--sub)">回</span></div>
                </div>
                <div style="width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fff"><div style="width:11px;height:13px;border:1.5px solid var(--sub);border-top:0;border-radius:0 0 3px 3px;position:relative"><div style="position:absolute;left:-2.5px;right:-2.5px;top:-4px;height:1.5px;background:var(--sub)"></div></div></div>
              </div>
              <button style="margin-top:10px;border:1px dashed var(--faint);background:transparent;color:var(--body);font-family:inherit;font-size:13px;font-weight:700;border-radius:13px;min-height:46px;cursor:pointer">種目を追加</button>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <div style="font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em">メモ</div>
              <div style="border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:60px;background:#fff;font-size:13px;color:var(--body);line-height:1.6">昼休みに</div>
            </div>

            <div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px">
              <button style="border:1px solid var(--line);background:#fff;color:var(--body);font-family:inherit;font-size:14px;font-weight:700;border-radius:13px;min-height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
                <span style="width:12px;height:14px;border:1.5px solid var(--sub);border-top:0;border-radius:0 0 3px 3px;position:relative;display:inline-block"><span style="position:absolute;left:-2.5px;right:-2.5px;top:-4px;height:1.5px;background:var(--sub);display:block"></span></span>
                この記録を削除
              </button>
              <div style="font-size:11px;color:var(--faint);line-height:1.6">削除は確認ダイアログを出してから実行します。</div>
            </div>
          </div>
