<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレ録</title>
<meta name="theme-color" content="#efe9df">
<meta name="apple-mobile-web-app-title" content="トレ録">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<!-- iPhone does not read the manifest when you add a page to the home screen;
     it looks for this instead, and falls back to a screenshot without it. -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="themes.css">
<!-- The chosen look is stamped on <html> before the first paint, so a page
     that opens in "classic" never flashes "paper" first. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('toreroku.theme');
    t = t === 'classic' || t === 'night' ? t : 'paper';
    document.documentElement.setAttribute('data-theme', t);
    var bar = { paper: '#efe9df', classic: '#eef1f6', night: '#14181d' };
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bar[t]);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'paper'); }
})();
</script>
<style>
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--body);
    -webkit-font-smoothing: antialiased;
    /* The phone frame in the design is 390 wide; on a wider screen the app
       keeps that width and sits in the middle rather than stretching. */
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  button:active { transform: translateY(1px); }
  /* The one primary button (Claude Design 2026-09-13): the same blue on the
     home "記録する" and the first-run "つづける". Pressed = a darker step of the
     same blue, so the change reads by lightness, not hue. */
  /* Confirm button (Claude Design 2026-09-14, 案A): no filled slab. A thick
   * outline, a faint tint of the action colour, and a 3px step underneath
   * carry the weight; pressing sinks it by the step. */
  button.primary { background: color-mix(in oklab, var(--color-action) 9%, var(--card)); color: var(--color-action);
    border: 2.5px solid var(--color-action); box-shadow: none; }
  /* Pressed: the tint deepens and the frame darkens (lightness, not hue). */
  button.primary:active { background: color-mix(in oklab, var(--color-action) 22%, var(--card)); border-color: var(--color-action-press); color: var(--color-action-press); transform: none; }
  button.primary[aria-disabled="true"], button.primary:disabled { border-color: var(--faint); color: var(--faint); box-shadow: none; background: var(--card); }
  button.primary:focus-visible { outline: 2px solid var(--color-action-press); outline-offset: 2px; }
  /* The same button once the day already holds a record: outline, not fill. */
  button.primary.outline { background: var(--card); color: var(--color-action); border: 1.5px solid var(--color-action); box-shadow: var(--shadow-card); }
  button.primary.outline:active { background: var(--line2); }
  a { color: var(--color-action); }
  /* Nothing here invents a look: the screens carry the design's own inline
     styles, lifted from design/screens/*.html. */
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .boot {
    padding: 40px 24px;
    font-size: 13px;
    color: var(--sub);
    line-height: 1.7;
  }
</style>
</head>
<body>
<div id="app"><div class="boot">読み込んでいます…</div></div>
<!-- The query is bumped whenever these files change, so a phone that already
     has the app picks up the new one instead of the copy in its cache. -->
<script src="store.js?v=107"></script>
<script src="app.js?v=107"></script>
</body>
</html>
